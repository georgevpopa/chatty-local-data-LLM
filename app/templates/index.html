<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OneNote FAQ Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #222; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    #search-box { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    #question { flex: 1; padding: 0.6rem 1rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 0.6rem 1.4rem; background: #0078d4; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #result { background: white; border-radius: 8px; padding: 1.5rem; box-shadow: 0 1px 4px rgba(0,0,0,0.1); display: none; }
    #answer { white-space: pre-wrap; line-height: 1.6; }
    #sources { margin-top: 1rem; font-size: 0.85rem; color: #555; }
    #sources span { display: inline-block; background: #e8f0fe; padding: 2px 8px; border-radius: 4px; margin: 2px; }
    #loading { display: none; color: #666; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <h1>📓 OneNote FAQ Agent</h1>
  <div id="search-box">
    <input id="question" type="text" placeholder="e.g. MOP to update SSL certificate on EVNFM" autofocus />
    <button id="ask-btn" onclick="ask()">Ask</button>
  </div>
  <div id="loading">⏳ Thinking...</div>
  <div id="result">
    <div id="answer"></div>
    <div id="sources"></div>
  </div>

  <script>
    document.getElementById("question").addEventListener("keydown", e => {
      if (e.key === "Enter") ask();
    });

    async function ask() {
      const q = document.getElementById("question").value.trim();
      if (!q) return;

      const btn = document.getElementById("ask-btn");
      btn.disabled = true;
      document.getElementById("loading").style.display = "block";
      document.getElementById("result").style.display = "none";

      try {
        const res = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: q }),
        });
        const data = await res.json();

        document.getElementById("answer").textContent = data.answer;
        document.getElementById("sources").innerHTML =
          "<strong>Sources:</strong> " +
          data.sources.map(s => `<span>${s.notebook} / ${s.section} / ${s.title}</span>`).join("");

        document.getElementById("result").style.display = "block";
      } catch (err) {
        document.getElementById("answer").textContent = "Error: " + err.message;
        document.getElementById("result").style.display = "block";
      } finally {
        btn.disabled = false;
        document.getElementById("loading").style.display = "none";
      }
    }
  </script>
</body>
</html>
